# Environment for reproducing the paper's numbers.
#
# The versions are pinned, not lower-bounded, because the result depends on
# them. In particular torch: from 2.2 on, the ONNX exporter folds weight
# tensors that hold identical values into a single initializer forwarded by
# Identity nodes. The benchmark graphs are untrained, so 100 of their 122
# tensors are duplicates and the fold inserts 72 Identity nodes into
# op_int_un. Those land between the admitted gates and the output, the
# chain-Lipschitz recursion cannot bound the Sub and ReduceMin operators
# behind them, and the certificate collapses: epsilon 25999.26 becomes 0.0 and
# the verdict degrades from certified-positive to uncertified. The export
# calls pass keep_initializers_as_inputs to suppress the fold, but pinning the
# version keeps the graphs identical to the ones the paper reports.
#
# Create with:   make env   (or: conda env create -f environment.yml)
# Activate with: conda activate archproof_repro
#
# scripts/setup_repro_env.sh builds the same environment with pip and adds a
# check that op_int_un exports to a graph with no Identity forwarding.
name: archproof_repro
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Versions as declared in the paper's software-stack paragraph.
      # CPU build: the admission probe and the IBP forward are CPU-only.
      - torch==2.1.0
      - torchvision==0.16.0
      - onnx==1.16.0
      - onnxruntime==1.18.0
      - numpy==1.26.4
      - onnxoptimizer==0.3.13
      # Required to import the benchmark model definitions: their module
      # imports the CIFAR training utilities they were written alongside.
      - pytorch_lightning
      - matplotlib
      - tqdm
      # Whole-LLM export and the PGD witness oracle.
      - transformers==4.40.0
      # Open-world scan (Table 49) streams models from the HF hub / hf-mirror.
      - huggingface_hub
      - torchattacks==3.4.0
      # The scanner-scope study runs the deployed scanners themselves, so the
      # comparison in that appendix needs them installed.
      - modelscan==0.8.6
      - picklescan==1.0.4
      # make test / make kick-tires run the unit-test suite.
      - pytest>=7
      - pytest-cov>=4
