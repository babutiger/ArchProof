[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archproof"
version = "1.0.0"
description = "Sound output-contribution certificates for dormant-gate-path (add-DGP) backdoors in ONNX models"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnx>=1.16,<2",
    "onnxruntime>=1.18",
    "numpy>=1.21,<2",
    "scipy>=1.10",
    "pandas>=1.4",
]

# The verifier core (verify_model, verify_model_phaseC, the interval
# propagator, the checker) needs only the dependencies above -- no torch,
# no GPU, no auto_LiRPA. The extras below are needed only to (re)generate
# models or to run specific experiment families.
[project.optional-dependencies]
export = [            # re-export torchvision / HuggingFace models to ONNX
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "huggingface_hub>=0.20",
]
sound-arithmetic = [  # certified (ULP-sound) arithmetic margins
    "mpmath>=1.3",
]
witness-oracle = [    # G2 witness oracle (PGD)
    "torchattacks>=3.4",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "torch>=2.0",
]
all = [
    "archproof[export,sound-arithmetic,witness-oracle,test]",
]

[tool.setuptools.packages.find]
include = ["archproof*", "backdoored_models*"]
exclude = ["tests*", "scripts*", "examples*", "runs*", "models*", "verify*", "repro*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["_needs_api_update", "__pycache__", ".pytest_cache"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: tests that take >5 seconds",
    "comprehensive: full benchmark sweeps (skipped by default)",
]
