[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archproof"
version = "1.0.0"
description = "Sound output-contribution certificates for dormant-gate-path backdoors in ONNX models"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnx>=1.16,<2",
    "onnxruntime>=1.18",
    "numpy>=1.21,<2",
    "scipy>=1.10",
    "pandas>=1.4",
]

[project.optional-dependencies]
export = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "huggingface_hub>=0.20",
]
sound-arithmetic = [
    "mpmath>=1.3",
    "gmpy2>=2.1; platform_system != 'Windows'",
]
witness-oracle = [
    "torchattacks>=3.4",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "torch>=2.0",
]
all = [
    "archproof[export,sound-arithmetic,witness-oracle,test]",
]

[project.urls]
"Source" = "https://anonymous.4open.science/r/archproof"

[tool.setuptools.packages.find]
include = ["archproof*"]
exclude = ["tests*", "scripts*", "examples*", "results*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: tests that take >5 seconds",
    "comprehensive: full benchmark sweeps (skipped by default)",
]
